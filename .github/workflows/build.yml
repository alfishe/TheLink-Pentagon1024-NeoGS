# Builds the demo from source on every platform the vendored sjasmplus covers; each build checks every
# object and the disk against the author's files (tools/release.asm), so a green run means the same bytes.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # linux-x64
          - os: ubuntu-24.04-arm     # linux-arm64
          - os: macos-latest         # macos (universal)
          - os: windows-latest       # windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          ./build.sh
          ./build.sh stage1
          ./build.sh stage2
          ./build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build.cmd || exit /b 1
          call build.cmd stage1 || exit /b 1
          call build.cmd stage2 || exit /b 1
          call build.cmd || exit /b 1

      - name: Same as the published disk
        shell: bash
        run: cmp build/TheLink-NonDirectorsCut.scl release/TheLink-NonDirectorsCut.scl

      - uses: actions/upload-artifact@v7
        with:
          name: TheLink-${{ matrix.os }}
          path: build/TheLink-NonDirectorsCut.scl
